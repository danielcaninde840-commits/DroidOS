
name: Construir ISO do DroidOS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Instalar ferramentas
        run: |
          sudo apt-get update
          sudo apt-get install -y live-build debootstrap xorriso squashfs-tools grub-pc-bin grub-efi-amd64-bin grub-efi-amd64-signed mtools dosfstools

      - name: Preparar arquivos
        run: |
          chmod +x auto/config
          chmod +x config/hooks/normal/*.hook.chroot
          chmod +x scripts/*.sh

      - name: Construir DroidOS
        run: |
          sudo lb clean --purge || true
          sudo lb config
          sudo lb build

      - name: Disponibilizar ISO
        uses: actions/upload-artifact@v4
        with:
          name: DroidOS-1.0-ISO
          path: live-image-amd64.hybrid.iso
          if-no-files-found: error
          retention-days: 7
